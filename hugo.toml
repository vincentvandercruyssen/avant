baseURL = "https://vincentvandercruyssen.github.io/avant/"
languageCode = "nl"
title = "Avant"
buildFuture = true

[taxonomies]
  thema = "themas"
  vak = "vakken"
  schooljaar = "schooljaren"
  leerkracht = "leerkrachten"

[params.sectionNames]
  motion = "Motion"
  web = "Webdesign en storytelling"
  beeld = "Beeldanalyse en -bewerking"
  grafische = "Grafische vormgeving"
  cursus = "Cursusmateriaal"
  doelen = "Doelstellingen"

[params]
  dateFormat = "2006-01-02"
  dateFormatISO = "2006-01-02"

[imaging]
  quality = 90
  resampleFilter = "Lanczos"

[build]
  cleanDestinationDir = true

[markup]
  [markup.highlight]
    style = "rose-pine-moon"
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[outputFormats.Planning]
  name = "Planning"
  mediaType = "text/html"
  baseName = "planning"
  isPlainText = false

[outputs]
  home = ["HTML"]
  page = ["HTML", "Planning"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

